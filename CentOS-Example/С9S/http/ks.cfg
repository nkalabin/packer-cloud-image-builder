#version=RHEL9
url --url="https://mirror.stream.centos.org/9-stream/BaseOS/x86_64/os/"
repo --name="AppStream" --baseurl="https://mirror.stream.centos.org/9-stream/AppStream/x86_64/os/"
text
firstboot --enable
eula --agreed
keyboard --vckeymap=us --xlayouts='us'
lang en_US.UTF-8
network --bootproto=dhcp --device=eth0 --activate --onboot=on
network --hostname=localhost.localdomain
rootpw --plaintext mysecurepassword
user --name=centos --plaintext --password=centos --groups=wheel --shell=/bin/bash
selinux --permissive
firewall --disabled
services --enabled="NetworkManager,sshd,cloud-init,cloud-init-local,cloud-config,cloud-final"
timezone Europe/Moscow --utc
bootloader --location=mbr --append="console=tty0 console=ttyS0,115200n8 net.ifnames=0 biosdevname=0"
zerombr
clearpart --all --initlabel
autopart --type=plain --fstype=ext4 --noswap --noboot --nohome
reboot
%packages --ignoremissing --excludedocs
@^minimal-environment
openssh-clients
curl
dnf-utils
drpm
net-tools
sudo
vim
wget
python3
cloud-init
cloud-utils-growpart
gdisk
%end
%addon com_redhat_kdump --disable
%end

%post
# Включение пароля для sudo (требуется для cloud-init)
echo '%wheel ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers.d/wheel

# Настройка SSH
sed -i 's/#PermitRootLogin yes/PermitRootLogin no/' /etc/ssh/sshd_config
echo 'PermitRootLogin no' >> /etc/ssh/sshd_config
echo 'UseDNS no' >> /etc/ssh/sshd_config

# Создание базовой конфигурации network
cat > /etc/sysconfig/network-scripts/ifcfg-eth0 << 'EOF'
DEVICE=eth0
BOOTPROTO=dhcp
ONBOOT=yes
TYPE=Ethernet
USERCTL=no
EOF

%end